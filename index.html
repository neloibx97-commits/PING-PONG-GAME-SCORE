<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping Pong Keeper</title>

    <style>
      .winner {
        color: green;
      }

      .loser {
        color: red;
      }
    </style>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main id="game-card">
      <img
        src="./images/roszie-table-tennis-7415974_1920.png"
        alt="ping pong paddle game"
        class="game-image"
      />

      <div id="pingBall">🏓</div>

      <div class="game-content">
        <div id="winnerMessage" class="winner-message">
          🏆 PLAYER ONE WINS! 🏆
        </div>

        <h1>
          <span id="p1Display">0</span>
          to
          <span id="p2Display">0</span>
        </h1>

        <p>Use the buttons below to keep score.</p>
        <label for="playto">Playing To</label>
        <select name="" id="playto">
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
        </select>
      </div>

      <div id="button-container">
        <button id="p1Button">Player One</button>
        <button id="p2Button">Player Two</button>
        <button id="reset">Reset</button>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
